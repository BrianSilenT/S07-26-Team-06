spring:
  application:
    name: datacenter-benchmark-engine

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/benchmark}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway controla el esquema; Hibernate solo valida que coincida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.benchmark.datacenter: INFO

# --- Configuracion propia del motor de rebalanceo ---
benchmark:
  rebalancing:
    # k = numero de respuestas primarias necesarias para que el peso primario llegue a ~50%
    smoothing-factor-k: 50
    # nunca depender 100% de datos primarios, incluso con miles de respuestas
    max-primary-weight: 0.95
